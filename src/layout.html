<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<meta name="description" content="{{description}}">
<meta name="theme-color" content="#f6f1e7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121e22" media="(prefers-color-scheme: dark)">
<meta property="og:type" content="website">
<meta property="og:title" content="{{title}}">
<meta property="og:description" content="{{description}}">
<meta property="og:image" content="{{base_url}}assets/images/icon-512.png">
<meta property="og:url" content="{{canonical}}">
<link rel="canonical" href="{{canonical}}">
<link rel="icon" type="image/png" href="{{base}}assets/images/favicon.png">
<link rel="apple-touch-icon" href="{{base}}assets/images/apple-touch-icon.png">
<link rel="stylesheet" href="{{base}}assets/site.css">
</head>
<body class="{{page_class}}">
<a class="skip" href="#main">Skip to content</a>
<header class="site-header">
  <div class="wrap">
    <a class="brand" href="{{base}}"><img src="{{base}}assets/images/favicon.png" alt="" width="32" height="32"><span>Property Asset</span></a>
    <nav aria-label="Main">{{nav}}</nav>
  </div>
</header>
<main id="main">
{{body}}
</main>
<footer class="site-footer">
  <div class="wrap">
    <p class="brand-line"><img src="{{base}}assets/images/favicon.png" alt="" width="24" height="24"> Property Asset</p>
    <nav aria-label="Footer">
      <a href="{{base}}#features">Features</a>
      <a href="{{base}}support.html">Support</a>
      <a href="{{base}}privacy.html">Privacy Policy</a>
      <a href="{{base}}terms.html">Terms and Conditions</a>
    </nav>
    <p class="fine">© {{year}} Property Asset. Apple, iPhone, iPad and Mac are trademarks of Apple Inc.</p>
  </div>
</footer>
</body>
</html>
