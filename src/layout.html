<!doctype html>
<html lang="{{lang}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<meta name="description" content="{{description}}">
<meta name="theme-color" content="#f6f1e7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121e22" media="(prefers-color-scheme: dark)">
<meta property="og:type" content="website">
<meta property="og:title" content="{{title}}">
<meta property="og:description" content="{{description}}">
<meta property="og:image" content="{{base_url}}assets/images/icon-512.png">
<meta property="og:url" content="{{canonical}}">
<link rel="canonical" href="{{canonical}}">
<link rel="icon" type="image/png" href="{{base}}assets/images/favicon.png">
<link rel="apple-touch-icon" href="{{base}}assets/images/apple-touch-icon.png">
<link rel="stylesheet" href="{{base}}assets/site.css">
{{alternates}}
</head>
<body class="{{page_class}}">
<a class="skip" href="#main">{{t:skip}}</a>
<header class="site-header">
  <div class="wrap">
    <a class="brand" href="{{home}}"><img src="{{base}}assets/images/favicon.png" alt="" width="32" height="32"><span>Property Asset</span></a>
    <nav aria-label="Main">{{nav}}</nav>
  </div>
</header>
<main id="main">
{{body}}
</main>
<footer class="site-footer">
  <div class="wrap">
    <p class="brand-line"><img src="{{base}}assets/images/favicon.png" alt="" width="24" height="24"> Property Asset</p>
    <nav aria-label="Footer">
      <a href="{{home}}#features">{{t:nav_features}}</a>
      <a href="{{home}}support.html">{{t:nav_support}}</a>
      <a href="{{home}}privacy.html">{{t:footer_privacy}}</a>
      <a href="{{home}}terms.html">{{t:footer_terms}}</a>
    </nav>
    <p class="fine">© {{year}} Property Asset. {{t:fine_print}}</p>
  </div>
</footer>
<script>
// Close the language menu on a click outside it or on Escape.
document.addEventListener("click", e => document.querySelectorAll(".lang-menu[open]").forEach(m => { if (!m.contains(e.target)) m.open = false; }));
document.addEventListener("keydown", e => { if (e.key === "Escape") document.querySelectorAll(".lang-menu[open]").forEach(m => { m.open = false; m.querySelector("summary").focus(); }); });
</script>
</body>
</html>
